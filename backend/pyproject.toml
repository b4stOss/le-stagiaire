[project]
name = "rapport-backend"
version = "0.1.0"
description = "Analyst agent over annual reports, built on Mistral's platform"
requires-python = ">=3.12"
dependencies = [
    "mistralai>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pypdf>=6.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "pyright>=1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pyright]
include = ["app", "scripts", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# French thousands separators (narrow no-break space) are parsed on purpose
"app/evals.py" = ["RUF001"]
"tests/test_evals.py" = ["RUF001"]
